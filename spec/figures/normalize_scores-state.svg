<defs>
      <style>#normalize_scores-state-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:system-ui,sans-serif; --font-serif:Georgia,serif; --font-mono:ui-monospace,monospace; }
      #normalize_scores-state-root { color: var(--color-ink); font-family: var(--font-sans); }
      #normalize_scores-state-root .diagram-container { width:100%; overflow-x:auto; }
      #normalize_scores-state-root text { fill:var(--color-ink); font-family:var(--font-sans); font-size:12px; }
      #normalize_scores-state-root .title { font-family:var(--font-serif); font-size:28px; }
      #normalize_scores-state-root .heading { font-size:14px; font-weight:600; }
      #normalize_scores-state-root .mono { font-family:var(--font-mono); font-size:12px; }
      #normalize_scores-state-root .note { font-size:11px; fill:var(--color-muted); }
      #normalize_scores-state-root .boundary { fill:#ffffff; stroke:#4f5d75; stroke-width:1.5; }
      #normalize_scores-state-root .wire { fill:none; stroke:#4f5d75; stroke-width:1.5; marker-end:url(#normalize_scores-state-arrow); }
      #normalize_scores-state-root .accent-wire { fill:none; stroke:#bf4520; stroke-width:1.5; marker-end:url(#normalize_scores-state-arrow-accent); }
      #normalize_scores-state-root .mask { fill:#ffffff; stroke:none; }
      @media print {
#normalize_scores-state-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="normalize_scores-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="normalize_scores-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="56" class="title">normalize_scores: invocation lifecycle</text>
<path d="M 360 208 C 440 208, 520 208, 600 208" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#normalize_scores-state-arrow)"/><text x="480" y="192" text-anchor="middle" class="mono">next causal score</text>
<path d="M 700 252 C 700 288, 700 324, 700 360" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#normalize_scores-state-arrow)"/><text x="720" y="308" text-anchor="start" class="mono">query&#39;s final score</text>
<path d="M 600 404 C 520 404, 440 404, 360 404" class="accent-wire" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#normalize_scores-state-arrow-accent)"/><text x="480" y="388" text-anchor="middle" class="mono">all outputs accepted</text>
<rect x="160" y="164" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="172" y="188" class="heading">Accept tile</text><text x="172" y="212" class="note">Fresh state per row and head.</text><text x="172" y="232" class="note">No retained normalization state.</text>
<rect x="600" y="164" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="612" y="188" class="heading">Update online</text><text x="612" y="212" class="note">Track FP32 maximum and sum.</text><text x="612" y="232" class="note">Emit matched alpha/beta factors.</text>
<rect x="600" y="360" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="612" y="384" class="heading">Emit final sums</text><text x="612" y="408" class="note">This query&#39;s final score is used.</text><text x="612" y="428" class="note">Provide final denominators.</text>
<rect x="160" y="360" width="200" height="88" rx="8" fill="#fff3ed" stroke="#bf4520"/><text x="172" y="384" class="heading">Return</text><text x="172" y="408" class="note">Factors and sums accepted.</text><text x="172" y="428" class="note">Invocation state expires.</text>
<text x="40" y="96" class="note">Single invocation; controls and all streams remain associated until completion.</text>
<text x="40" y="520" class="note">Per-record/query updates repeat; processing and emission may overlap while required ordering is preserved.</text>
<text x="40" y="536" class="note">The phases impose no whole-tile barrier or full score/probability buffer. Only final return waits for all required outputs.</text>
<text x="40" y="568" class="note">Conceptual invocation lifecycle; per-call maximum/sum state is not retained between invocations.</text>

</svg>
