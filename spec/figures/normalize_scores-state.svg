<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="normalize_scores-state-title normalize_scores-state-desc" data-hls-function="normalize_scores" data-hls-figure="state" data-hls-state-view="invocation" id="normalize_scores-state-root">
<title id="normalize_scores-state-title">normalize_scores: invocation lifecycle</title>
<desc id="normalize_scores-state-desc">Source-supported states and completion, with implementation timing deliberately unspecified.</desc>
