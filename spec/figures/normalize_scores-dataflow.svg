<defs>
      <style>#normalize_scores-dataflow-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:system-ui,sans-serif; --font-serif:Georgia,serif; --font-mono:ui-monospace,monospace; }
      #normalize_scores-dataflow-root { color: var(--color-ink); font-family: var(--font-sans); }
      #normalize_scores-dataflow-root .diagram-container { width:100%; overflow-x:auto; }
      #normalize_scores-dataflow-root text { fill:var(--color-ink); font-family:var(--font-sans); font-size:12px; }
      #normalize_scores-dataflow-root .title { font-family:var(--font-serif); font-size:28px; }
      #normalize_scores-dataflow-root .heading { font-size:14px; font-weight:600; }
      #normalize_scores-dataflow-root .mono { font-family:var(--font-mono); font-size:12px; }
      #normalize_scores-dataflow-root .note { font-size:11px; fill:var(--color-muted); }
      #normalize_scores-dataflow-root .boundary { fill:#ffffff; stroke:#4f5d75; stroke-width:1.5; }
      #normalize_scores-dataflow-root .wire { fill:none; stroke:#4f5d75; stroke-width:1.5; marker-end:url(#normalize_scores-dataflow-arrow); }
      #normalize_scores-dataflow-root .accent-wire { fill:none; stroke:#bf4520; stroke-width:1.5; marker-end:url(#normalize_scores-dataflow-arrow-accent); }
      #normalize_scores-dataflow-root .mask { fill:#ffffff; stroke:none; }
      @media print {
#normalize_scores-dataflow-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="normalize_scores-dataflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="normalize_scores-dataflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="56" class="title">normalize_scores: primary interaction</text>
<line x1="160" y1="156" x2="160" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="480" y1="156" x2="480" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="800" y1="156" x2="800" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<rect x="476" y="172" width="8" height="312" fill="#e9edf2" stroke="#4f5d75" stroke-width="0.8"/>
<g data-hls-path="scores" data-hls-producer="self.scores" data-hls-consumer="self" data-hls-datatype="brisk::Score[4]"><path d="M 160 208 H 480" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#normalize_scores-dataflow-arrow)"/><rect x="168" y="184" width="196" height="16" rx="2" class="mask"/><text x="172" y="196" class="mono">scores · next causal score</text></g>
<g data-hls-path="scales" data-hls-producer="self" data-hls-consumer="self.scales" data-hls-datatype="brisk::Scale[4]"><path d="M 480 328 H 800" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#normalize_scores-dataflow-arrow)"/><rect x="488" y="304" width="248" height="16" rx="2" class="mask"/><text x="492" y="316" class="mono">scales · previous/current factors</text></g>
<g data-hls-path="denominators" data-hls-producer="self" data-hls-consumer="self.denominators" data-hls-datatype="brisk::Denominator[4]"><path d="M 480 448 H 800" class="accent-wire" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#normalize_scores-dataflow-arrow-accent)"/><rect x="488" y="424" width="240" height="16" rx="2" class="mask"/><text x="492" y="436" class="mono">denominators · completed query</text></g>
<rect x="76" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="160" y="132" text-anchor="middle" class="mono">scores[4]</text>
<rect x="396" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="480" y="132" text-anchor="middle" class="mono">normalize_scores</text>
<rect x="716" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="800" y="132" text-anchor="middle" class="mono">scales / denominators</text>
<text x="40" y="84" class="note">Repeat the score-to-factor update independently for each lane, row, head and representative.</text>
<text x="496" y="264" class="note">Update FP32 maximum and sum.</text>
<text x="496" y="392" class="note">This query&#39;s final score consumed.</text>
<text x="40" y="524" class="note">Return follows every factor and final denominator; no full probability array is emitted.</text>
<text x="40" y="552" class="note">Logical event order only; spacing does not specify cycles, latency or initiation interval.</text>

</svg>
