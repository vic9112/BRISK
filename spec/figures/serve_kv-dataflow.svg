<defs>
      <style>#serve_kv-dataflow-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:system-ui,sans-serif; --font-serif:Georgia,serif; --font-mono:ui-monospace,monospace; }
      #serve_kv-dataflow-root { color: var(--color-ink); font-family: var(--font-sans); }
      #serve_kv-dataflow-root .diagram-container { width:100%; overflow-x:auto; }
      #serve_kv-dataflow-root text { fill:var(--color-ink); font-family:var(--font-sans); font-size:12px; }
      #serve_kv-dataflow-root .title { font-family:var(--font-serif); font-size:28px; }
      #serve_kv-dataflow-root .heading { font-size:14px; font-weight:600; }
      #serve_kv-dataflow-root .mono { font-family:var(--font-mono); font-size:12px; }
      #serve_kv-dataflow-root .note { font-size:11px; fill:var(--color-muted); }
      #serve_kv-dataflow-root .boundary { fill:#ffffff; stroke:#4f5d75; stroke-width:1.5; }
      #serve_kv-dataflow-root .wire { fill:none; stroke:#4f5d75; stroke-width:1.5; marker-end:url(#serve_kv-dataflow-arrow); }
      #serve_kv-dataflow-root .accent-wire { fill:none; stroke:#bf4520; stroke-width:1.5; marker-end:url(#serve_kv-dataflow-arrow-accent); }
      #serve_kv-dataflow-root .mask { fill:#ffffff; stroke:none; }
      @media print {
#serve_kv-dataflow-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="serve_kv-dataflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="serve_kv-dataflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="56" class="title">serve_kv: primary interaction</text>
<line x1="128" y1="156" x2="128" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="352" y1="156" x2="352" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="576" y1="156" x2="576" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="816" y1="156" x2="816" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<rect x="572" y="172" width="8" height="312" fill="#e9edf2" stroke="#4f5d75" stroke-width="0.8"/>
<g data-hls-path="backing_read" data-hls-producer="self.backing" data-hls-consumer="self" data-hls-datatype="cache_line_t *"><path d="M 128 208 H 576" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#serve_kv-dataflow-arrow)"/><rect x="136" y="184" width="312" height="16" rx="2" class="mask"/><text x="140" y="196" class="mono">backing_read · earlier nonresident history</text></g>
<g data-hls-path="incoming" data-hls-producer="self.incoming" data-hls-consumer="self" data-hls-datatype="cache_line_t"><path d="M 352 272 H 576" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#serve_kv-dataflow-arrow)"/><rect x="360" y="248" width="68" height="16" rx="2" class="mask"/><text x="364" y="260" class="mono">incoming</text></g>
<g data-hls-path="backing_write" data-hls-producer="self" data-hls-consumer="self.backing" data-hls-datatype="cache_line_t *"><path d="M 576 336 H 128" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#serve_kv-dataflow-arrow)"/><rect x="136" y="312" width="296" height="16" rx="2" class="mask"/><text x="140" y="324" class="mono">backing_write · live victim before reuse</text></g>
<g data-hls-path="keys" data-hls-producer="self" data-hls-consumer="self.keys" data-hls-datatype="brisk::KChunk"><path d="M 576 416 H 816" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#serve_kv-dataflow-arrow)"/><rect x="584" y="392" width="40" height="16" rx="2" class="mask"/><text x="588" y="404" class="mono">keys</text></g>
<g data-hls-path="values" data-hls-producer="self" data-hls-consumer="self.values" data-hls-datatype="brisk::VChunk"><path d="M 576 464 H 816" class="accent-wire" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#serve_kv-dataflow-arrow-accent)"/><rect x="584" y="440" width="52" height="16" rx="2" class="mask"/><text x="588" y="452" class="mono">values</text></g>
<rect x="44" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="128" y="132" text-anchor="middle" class="mono">backing</text>
<rect x="268" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="352" y="132" text-anchor="middle" class="mono">incoming</text>
<rect x="492" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="576" y="132" text-anchor="middle" class="mono">serve_kv</text>
<rect x="732" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="816" y="132" text-anchor="middle" class="mono">keys / values</text>
<text x="40" y="84" class="note">Illustrative overflow tile: history first, then an occupied-slot incoming install.</text>
<text x="592" y="376" class="note">Install whole record; publish tag.</text>
<text x="40" y="524" class="note">Return follows accepted chunks and completed ownership effects. Resident hits omit history HBM reads.</text>
<text x="40" y="552" class="note">Logical event order only; spacing does not specify cycles, latency or initiation interval.</text>

</svg>
