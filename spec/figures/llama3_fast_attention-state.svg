<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="llama3_fast_attention-state-title llama3_fast_attention-state-desc" data-hls-function="llama3_fast_attention" data-hls-figure="state" data-hls-state-view="architectural" id="llama3_fast_attention-state-root">
<title id="llama3_fast_attention-state-title">BRISK root invocation state</title>
<desc id="llama3_fast_attention-state-desc">Valid calls dispatch and drain ordered tiles, invalid controls return without child effects, and K/V ownership persists in the lane services.</desc>
