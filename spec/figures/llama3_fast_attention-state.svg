<defs>
      <style>#llama3_fast_attention-state-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
      #llama3_fast_attention-state-root { color: var(--color-ink); font-family: var(--font-sans); }
      #llama3_fast_attention-state-root .diagram-container { width:100%; overflow-x:auto; }
      #llama3_fast_attention-state-root text { fill:#2d3142; font-family:var(--font-sans); }
      #llama3_fast_attention-state-root .name { font-size:12px; font-weight:600; }
      #llama3_fast_attention-state-root .sub { font-size:9px; font-family:var(--font-mono); fill:#4f5d75; }
      #llama3_fast_attention-state-root .label { font-size:8px; font-family:var(--font-mono); fill:#4f5d75; }
      #llama3_fast_attention-state-root .title { font-size:28px; font-family:var(--font-serif); }
      #llama3_fast_attention-state-root .note { font-size:11px; fill:#4f5d75; }
      @media print {
#llama3_fast_attention-state-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="llama3_fast_attention-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="llama3_fast_attention-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
<marker id="llama3_fast_attention-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="64" class="title" text-anchor="start">Root invocation and retained ownership</text><text x="40" y="92" class="note" text-anchor="start">Logical control phases; this is not a required RTL state encoding. Resident K/V belongs only to serve_kv.</text><circle cx="64" cy="232" r="6" fill="#2d3142"/><g><path d="M 70,232 C 80,232 84,232 96,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="60" y="198" width="44" height="16" rx="2" fill="#f5f5f5"/><text x="82" y="210" class="label" text-anchor="middle">call</text></g><g><path d="M 256,232 C 292,232 300,232 336,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="244" y="198" width="104" height="16" rx="2" fill="#f5f5f5"/><text x="296" y="210" class="label" text-anchor="middle">capture controls</text></g><g><path d="M 496,232 C 532,232 540,232 576,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="504" y="198" width="64" height="16" rx="2" fill="#f5f5f5"/><text x="536" y="210" class="label" text-anchor="middle">valid</text></g><g><path d="M 416,264 C 416,328 416,352 416,416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="424" y="342" width="112" height="16" rx="2" fill="#f5f5f5"/><text x="480" y="354" class="label" text-anchor="middle">invalid / status</text></g><g><path d="M 736,232 C 772,232 780,232 816,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="740" y="198" width="72" height="16" rx="2" fill="#f5f5f5"/><text x="776" y="210" class="label" text-anchor="middle">start tile</text></g><g><path d="M 976,232 C 1008,232 1040,232 1072,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="980" y="198" width="88" height="16" rx="2" fill="#f5f5f5"/><text x="1024" y="210" class="label" text-anchor="middle">last tile done</text></g><g><path d="M 896,264 C 896,328 704,328 656,264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="672" y="342" width="208" height="16" rx="2" fill="#f5f5f5"/><text x="776" y="354" class="label" text-anchor="middle">tile done; more / advance</text></g><g><path d="M 1152,264 V 612 Q 1152,620 1144,620 H 72 Q 64,620 64,612 V 256 Q 64,248 72,248 H 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="576" y="598" width="160" height="16" rx="2" fill="#f5f5f5"/><text x="656" y="610" class="label" text-anchor="middle">return / next call</text></g><g><path d="M 416,480 C 416,528 144,528 144,264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llama3_fast_attention-state-arrow)"/><rect x="200" y="542" width="192" height="16" rx="2" fill="#f5f5f5"/><text x="296" y="554" class="label" text-anchor="middle">return without child work</text></g><g><rect x="96" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="176" y="230" class="name" text-anchor="middle">Ready</text><text x="176" y="248" class="sub" text-anchor="middle">no invocation active</text></g><g><rect x="336" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="416" y="230" class="name" text-anchor="middle">Validate</text><text x="416" y="248" class="sub" text-anchor="middle">no child side effects</text></g><g><rect x="576" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="656" y="230" class="name" text-anchor="middle">Dispatch</text><text x="656" y="248" class="sub" text-anchor="middle">ordered tile inputs</text></g><g><rect x="816" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="896" y="230" class="name" text-anchor="middle">Drain</text><text x="896" y="248" class="sub" text-anchor="middle">wait for required effects</text></g><g><rect x="1072" y="200" width="160" height="64" rx="8" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/><text x="1152" y="230" class="name" text-anchor="middle">Complete</text><text x="1152" y="248" class="sub" text-anchor="middle">output / status visible</text></g><g><rect x="336" y="416" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="416" y="446" class="name" text-anchor="middle">Rejected</text><text x="416" y="464" class="sub" text-anchor="middle">output / K/V unchanged</text></g><text x="40" y="680" class="note" text-anchor="start">Retained across successful calls: lane-local resident payloads and tags, unless displaced or the live identity is retired.</text><text x="40" y="704" class="note" text-anchor="start">Call-local only: query tiles, QK reductions, online maxima/sums, SV accumulators and pending transfers.</text><line x1="40" y1="760" x2="1240" y2="760" stroke="#bfc0c0"/><text x="40" y="792" class="note" text-anchor="start">A finite wait holds pending work; the caller supplies eventual memory service and output capacity.</text>
</svg>
