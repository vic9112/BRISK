<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="llama3_fast_attention-dataflow-title llama3_fast_attention-dataflow-desc" data-hls-function="llama3_fast_attention" data-hls-figure="dataflow" id="llama3_fast_attention-dataflow-root" >
<title id="llama3_fast_attention-dataflow-title">BRISK root dataflow</title>
<desc id="llama3_fast_attention-dataflow-desc">One resident decode streams selected history, installs and forwards the incoming record, and completes only after output and ownership effects.</desc>
