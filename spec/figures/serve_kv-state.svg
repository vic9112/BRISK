<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="serve_kv-state-title serve_kv-state-desc" data-hls-function="serve_kv" data-hls-figure="state" data-hls-state-view="architectural" id="serve_kv-state-root">
<title id="serve_kv-state-title">serve_kv: ownership lifecycle</title>
<desc id="serve_kv-state-desc">Source-supported states and completion, with implementation timing deliberately unspecified.</desc>
