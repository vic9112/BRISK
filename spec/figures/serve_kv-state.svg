<defs>
      <style>#serve_kv-state-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:system-ui,sans-serif; --font-serif:Georgia,serif; --font-mono:ui-monospace,monospace; }
      #serve_kv-state-root { color: var(--color-ink); font-family: var(--font-sans); }
      #serve_kv-state-root .diagram-container { width:100%; overflow-x:auto; }
      #serve_kv-state-root text { fill:var(--color-ink); font-family:var(--font-sans); font-size:12px; }
      #serve_kv-state-root .title { font-family:var(--font-serif); font-size:28px; }
      #serve_kv-state-root .heading { font-size:14px; font-weight:600; }
      #serve_kv-state-root .mono { font-family:var(--font-mono); font-size:12px; }
      #serve_kv-state-root .note { font-size:11px; fill:var(--color-muted); }
      #serve_kv-state-root .boundary { fill:#ffffff; stroke:#4f5d75; stroke-width:1.5; }
      #serve_kv-state-root .wire { fill:none; stroke:#4f5d75; stroke-width:1.5; marker-end:url(#serve_kv-state-arrow); }
      #serve_kv-state-root .accent-wire { fill:none; stroke:#bf4520; stroke-width:1.5; marker-end:url(#serve_kv-state-arrow-accent); }
      #serve_kv-state-root .mask { fill:#ffffff; stroke:none; }
      @media print {
#serve_kv-state-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="serve_kv-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="serve_kv-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="56" class="title">serve_kv: ownership lifecycle</text>
<path d="M 360 208 C 440 208, 520 208, 600 208" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#serve_kv-state-arrow)"/><text x="480" y="192" text-anchor="middle" class="mono">next record / resolve identity</text>
<path d="M 700 252 C 700 288, 700 324, 700 360" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#serve_kv-state-arrow)"/><text x="720" y="308" text-anchor="start" class="mono">source selected</text>
<path d="M 600 404 C 520 404, 440 404, 360 404" class="accent-wire" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#serve_kv-state-arrow-accent)"/><text x="480" y="388" text-anchor="middle" class="mono">writes visible / forward</text>
<path d="M 260 360 C 260 324, 260 288, 260 252" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#serve_kv-state-arrow)"/><text x="120" y="308" text-anchor="start" class="mono">accepted</text>
<rect x="160" y="164" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="172" y="188" class="heading">Ready owners</text><text x="172" y="212" class="note">Valid tags select authority.</text><text x="172" y="232" class="note">Uninitialized tags are invalid.</text>
<rect x="600" y="164" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="612" y="188" class="heading">Select record</text><text x="612" y="212" class="note">History: exact hit or HBM miss.</text><text x="612" y="232" class="note">Incoming: inspect target slot.</text>
<rect x="600" y="360" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="612" y="384" class="heading">Preserve / install</text><text x="612" y="408" class="note">History leaves owners unchanged.</text><text x="612" y="428" class="note">Write live victim before reuse.</text>
<rect x="160" y="360" width="200" height="88" rx="8" fill="#fff3ed" stroke="#bf4520"/><text x="172" y="384" class="heading">Forward / complete</text><text x="172" y="408" class="note">Install whole payload before tag.</text><text x="172" y="428" class="note">Accept K/V and ownership effects.</text>
<text x="40" y="96" class="note">Retained source ownership across calls of a live layer/epoch.</text>
<text x="40" y="520" class="note">Per-record/query updates repeat; processing and emission may overlap while required ordering is preserved.</text>
<text x="40" y="536" class="note">The phases impose no whole-tile barrier or full score/probability buffer. Only final return waits for all required outputs.</text>
<text x="40" y="568" class="note">Architectural ownership lifecycle, not a mandated RTL controller. Retirement discards only dead contexts.</text>

</svg>
