<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="accumulate_values-state-title accumulate_values-state-desc" data-hls-function="accumulate_values" data-hls-figure="state" data-hls-state-view="invocation" id="accumulate_values-state-root">
<title id="accumulate_values-state-title">accumulate_values: invocation lifecycle</title>
<desc id="accumulate_values-state-desc">Source-supported states and completion, with implementation timing deliberately unspecified.</desc>
