<defs>
      <style>#accumulate_values-state-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:system-ui,sans-serif; --font-serif:Georgia,serif; --font-mono:ui-monospace,monospace; }
      #accumulate_values-state-root { color: var(--color-ink); font-family: var(--font-sans); }
      #accumulate_values-state-root .diagram-container { width:100%; overflow-x:auto; }
      #accumulate_values-state-root text { fill:var(--color-ink); font-family:var(--font-sans); font-size:12px; }
      #accumulate_values-state-root .title { font-family:var(--font-serif); font-size:28px; }
      #accumulate_values-state-root .heading { font-size:14px; font-weight:600; }
      #accumulate_values-state-root .mono { font-family:var(--font-mono); font-size:12px; }
      #accumulate_values-state-root .note { font-size:11px; fill:var(--color-muted); }
      #accumulate_values-state-root .boundary { fill:#ffffff; stroke:#4f5d75; stroke-width:1.5; }
      #accumulate_values-state-root .wire { fill:none; stroke:#4f5d75; stroke-width:1.5; marker-end:url(#accumulate_values-state-arrow); }
      #accumulate_values-state-root .accent-wire { fill:none; stroke:#bf4520; stroke-width:1.5; marker-end:url(#accumulate_values-state-arrow-accent); }
      #accumulate_values-state-root .mask { fill:#ffffff; stroke:none; }
      @media print {
#accumulate_values-state-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="accumulate_values-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="accumulate_values-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="56" class="title">accumulate_values: invocation lifecycle</text>
<path d="M 360 208 C 440 208, 520 208, 600 208" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#accumulate_values-state-arrow)"/><text x="480" y="192" text-anchor="middle" class="mono">ordered values and factors</text>
<path d="M 700 252 C 700 288, 700 324, 700 360" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#accumulate_values-state-arrow)"/><text x="720" y="308" text-anchor="start" class="mono">final denominator</text>
<path d="M 600 404 C 520 404, 440 404, 360 404" class="accent-wire" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#accumulate_values-state-arrow-accent)"/><text x="480" y="388" text-anchor="middle" class="mono">all output words accepted</text>
<rect x="160" y="164" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="172" y="188" class="heading">Accept tile</text><text x="172" y="212" class="note">Zero FP32 output accumulators.</text><text x="172" y="232" class="note">No retained output state.</text>
<rect x="600" y="164" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="612" y="188" class="heading">Rescale and add</text><text x="612" y="212" class="note">Use matched value and factors.</text><text x="612" y="232" class="note">Keep arithmetic in FP32.</text>
<rect x="600" y="360" width="200" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="612" y="384" class="heading">Normalize and pack</text><text x="612" y="408" class="note">Divide by final denominator.</text><text x="612" y="428" class="note">Round final elements to BF16.</text>
<rect x="160" y="360" width="200" height="88" rx="8" fill="#fff3ed" stroke="#bf4520"/><text x="172" y="384" class="heading">Return</text><text x="172" y="408" class="note">All output words accepted.</text><text x="172" y="428" class="note">Invocation state expires.</text>
<text x="40" y="96" class="note">Single invocation; controls and all streams remain associated until completion.</text>
<text x="40" y="520" class="note">Per-record/query updates repeat; processing and emission may overlap while required ordering is preserved.</text>
<text x="40" y="536" class="note">The phases impose no whole-tile barrier or full score/probability buffer. Only final return waits for all required outputs.</text>
<text x="40" y="568" class="note">Conceptual invocation lifecycle; no persistent state, reset protocol or physical FSM is implied.</text>

</svg>
