<defs>
      <style>#score_queries-dataflow-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:system-ui,sans-serif; --font-serif:Georgia,serif; --font-mono:ui-monospace,monospace; }
      #score_queries-dataflow-root { color: var(--color-ink); font-family: var(--font-sans); }
      #score_queries-dataflow-root .diagram-container { width:100%; overflow-x:auto; }
      #score_queries-dataflow-root text { fill:var(--color-ink); font-family:var(--font-sans); font-size:12px; }
      #score_queries-dataflow-root .title { font-family:var(--font-serif); font-size:28px; }
      #score_queries-dataflow-root .heading { font-size:14px; font-weight:600; }
      #score_queries-dataflow-root .mono { font-family:var(--font-mono); font-size:12px; }
      #score_queries-dataflow-root .note { font-size:11px; fill:var(--color-muted); }
      #score_queries-dataflow-root .boundary { fill:#ffffff; stroke:#4f5d75; stroke-width:1.5; }
      #score_queries-dataflow-root .wire { fill:none; stroke:#4f5d75; stroke-width:1.5; marker-end:url(#score_queries-dataflow-arrow); }
      #score_queries-dataflow-root .accent-wire { fill:none; stroke:#bf4520; stroke-width:1.5; marker-end:url(#score_queries-dataflow-arrow-accent); }
      #score_queries-dataflow-root .mask { fill:#ffffff; stroke:none; }
      @media print {
#score_queries-dataflow-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="score_queries-dataflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="score_queries-dataflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="56" class="title">score_queries: primary interaction</text>
<line x1="128" y1="156" x2="128" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="352" y1="156" x2="352" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="576" y1="156" x2="576" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<line x1="816" y1="156" x2="816" y2="500" stroke="#c0c7d0" stroke-dasharray="4,4"/>
<rect x="572" y="172" width="8" height="312" fill="#e9edf2" stroke="#4f5d75" stroke-width="0.8"/>
<g data-hls-path="query_rep0" data-hls-producer="self.q0" data-hls-consumer="self" data-hls-datatype="brisk::QPair"><path d="M 128 216 H 576" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#score_queries-dataflow-arrow)"/><rect x="136" y="192" width="232" height="16" rx="2" class="mask"/><text x="140" y="204" class="mono">query_rep0 · query-pair loading</text></g>
<g data-hls-path="keys" data-hls-producer="self.keys" data-hls-consumer="self" data-hls-datatype="brisk::KChunk"><path d="M 352 320 H 576" class="wire" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#score_queries-dataflow-arrow)"/><rect x="360" y="296" width="168" height="16" rx="2" class="mask"/><text x="364" y="308" class="mono">keys · selected record</text></g>
<g data-hls-path="scores" data-hls-producer="self" data-hls-consumer="self.scores" data-hls-datatype="brisk::Score"><path d="M 576 440 H 816" class="accent-wire" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#score_queries-dataflow-arrow-accent)"/><rect x="584" y="416" width="52" height="16" rx="2" class="mask"/><text x="588" y="428" class="mono">scores</text></g>
<rect x="44" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="128" y="132" text-anchor="middle" class="mono">q0 / q1 / q2 / q3</text>
<rect x="268" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="352" y="132" text-anchor="middle" class="mono">keys</text>
<rect x="492" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="576" y="132" text-anchor="middle" class="mono">score_queries</text>
<rect x="732" y="100" width="168" height="56" rx="8" fill="#ffffff" stroke="#4f5d75"/><text x="816" y="132" text-anchor="middle" class="mono">scores</text>
<text x="40" y="84" class="note">Illustrative local tile. The remaining query representatives follow their matched streams.</text>
<text x="592" y="264" class="note">Reuse loaded queries across records.</text>
<text x="592" y="368" class="note">FP32 scaled QK; eligible rows only.</text>
<text x="40" y="524" class="note">Return follows all causal score packets; no score storage is retained between calls.</text>
<text x="40" y="552" class="note">Logical event order only; spacing does not specify cycles, latency or initiation interval.</text>

</svg>
