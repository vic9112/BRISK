[connectivity]
nk=llama3_fast_attention:1:llama3_fast_attention_1
sp=llama3_fast_attention_1.status_out:HBM[5]
sp=llama3_fast_attention_1.active_kv:HBM[4]
# Each lane can back all layers using a contiguous pair of HBM banks.
# Resident payload remains lane-local UltraRAM; these are overflow addresses.
sp=llama3_fast_attention_1.cache_kv0:HBM[8:9]
sp=llama3_fast_attention_1.cache_kv1:HBM[10:11]
sp=llama3_fast_attention_1.cache_kv2:HBM[12:13]
sp=llama3_fast_attention_1.cache_kv3:HBM[14:15]
sp=llama3_fast_attention_1.q0:HBM[0]
sp=llama3_fast_attention_1.out0:HBM[0]
sp=llama3_fast_attention_1.q1:HBM[1]
sp=llama3_fast_attention_1.out1:HBM[1]
sp=llama3_fast_attention_1.q2:HBM[2]
sp=llama3_fast_attention_1.out2:HBM[2]
sp=llama3_fast_attention_1.q3:HBM[6]
sp=llama3_fast_attention_1.out3:HBM[6]

[linkhook]
custom=postSysLink,source/tcl/u50_hbm_400.tcl
