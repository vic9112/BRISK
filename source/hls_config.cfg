part=xcu50-fsvh2104-2-e
freqhz=220Mhz

[hls]
relative_roots=file/..
flow_target=vitis
syn.top=llama3_fast_attention
syn.file=source/attention_kernel.cpp
syn.cflags=-std=c++17 -Isource -Ispec
tb.file=verification/brisk_hls_tb.cpp
tb.cflags=-std=c++17 -Ispec
csim.argv=--suite full
csim.code_analyzer=0
cosim.argv=--suite full
cosim.tool=xsim
cosim.trace_level=port
cosim.enable_dataflow_profiling=true
package.output.format=xo
package.output.file=build/llama3_fast_attention.xo

# Maximum interface sample counts, not on-chip storage capacity.
# Q/O: 2*8192*8*8 words. Active K/V: 2*8192*8*16 paired packs.
syn.directive.interface=mode=m_axi bundle=gmem_qo0 depth=1048576 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q0
syn.directive.interface=mode=m_axi bundle=gmem_qo1 depth=1048576 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q1
syn.directive.interface=mode=m_axi bundle=gmem_qo2 depth=1048576 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q2
syn.directive.interface=mode=m_axi bundle=gmem_qo3 depth=1048576 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q3
syn.directive.interface=mode=m_axi bundle=gmem_active depth=2097152 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention active_kv
syn.directive.interface=mode=m_axi bundle=gmem_qo0 depth=1048576 llama3_fast_attention out0
syn.directive.interface=mode=m_axi bundle=gmem_qo1 depth=1048576 llama3_fast_attention out1
syn.directive.interface=mode=m_axi bundle=gmem_qo2 depth=1048576 llama3_fast_attention out2
syn.directive.interface=mode=m_axi bundle=gmem_qo3 depth=1048576 llama3_fast_attention out3

# Per-layer backing: 2 batches * 8192 positions * 2 local heads * 8 lines.
syn.directive.interface=mode=m_axi bundle=gmem_kv0 depth=262144 llama3_fast_attention cache_kv0
syn.directive.interface=mode=m_axi bundle=gmem_kv1 depth=262144 llama3_fast_attention cache_kv1
syn.directive.interface=mode=m_axi bundle=gmem_kv2 depth=262144 llama3_fast_attention cache_kv2
syn.directive.interface=mode=m_axi bundle=gmem_kv3 depth=262144 llama3_fast_attention cache_kv3
