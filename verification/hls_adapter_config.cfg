part=xcu50-fsvh2104-2-e
freqhz=220Mhz

[hls]
relative_roots=file/..
flow_target=vitis
syn.top=llama3_fast_attention
syn.file=source/attention_kernel.cpp
syn.cflags=-std=c++17 -Isource -Ispec
tb.file=verification/brisk_hls_tb.cpp
tb.cflags=-std=c++17 -Ispec
csim.argv=--suite full
csim.code_analyzer=0
cosim.argv=--suite numeric
cosim.tool=xsim
cosim.trace_level=port
cosim.enable_dataflow_profiling=true
package.output.format=xo
package.output.file=build/llama3_fast_attention.adapter.xo

# Verification-adapter samples only: the largest exercised Q/O tensor has
# 1*40*8*8 packed words and the largest active tensor has 1*40*8*16 packs.
# Include all four guard words. The backing bounds below retain every authored
# Session's complete logical backing allocation and all four immediate guards.
# This profile is admissible only after byte-identical generated RTL is checked
# against source/hls_config.cfg; it does not change the supported host shape domain.
syn.directive.interface=mode=m_axi bundle=gmem_qo0 depth=2564 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q0
syn.directive.interface=mode=m_axi bundle=gmem_qo1 depth=2564 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q1
syn.directive.interface=mode=m_axi bundle=gmem_qo2 depth=2564 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q2
syn.directive.interface=mode=m_axi bundle=gmem_qo3 depth=2564 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention q3
syn.directive.interface=mode=m_axi bundle=gmem_active depth=5124 num_read_outstanding=8 max_read_burst_length=256 llama3_fast_attention active_kv
syn.directive.interface=mode=m_axi bundle=gmem_qo0 depth=2564 llama3_fast_attention out0
syn.directive.interface=mode=m_axi bundle=gmem_qo1 depth=2564 llama3_fast_attention out1
syn.directive.interface=mode=m_axi bundle=gmem_qo2 depth=2564 llama3_fast_attention out2
syn.directive.interface=mode=m_axi bundle=gmem_qo3 depth=2564 llama3_fast_attention out3

# Complete logical backing plus four guards for every group except identity:
# largest is the isolation Session, 2*59*2*8+4 = 1892 cache lines.
# Identity's maximum-stride Session uses hls_identity_config.cfg instead.
# Unused maximum transport tails are outside RTL observation; production's
# supported shape domain is unchanged. Require exact generated-hardware identity.
syn.directive.interface=mode=m_axi bundle=gmem_kv0 depth=1892 llama3_fast_attention cache_kv0
syn.directive.interface=mode=m_axi bundle=gmem_kv1 depth=1892 llama3_fast_attention cache_kv1
syn.directive.interface=mode=m_axi bundle=gmem_kv2 depth=1892 llama3_fast_attention cache_kv2
syn.directive.interface=mode=m_axi bundle=gmem_kv3 depth=1892 llama3_fast_attention cache_kv3
